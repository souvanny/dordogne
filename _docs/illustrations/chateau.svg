<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Château en SVG">
  <!-- Ciel -->
  <rect width="400" height="300" rx="24" fill="#E8F0FE"/>
  <!-- Colline -->
  <ellipse cx="200" cy="280" rx="220" ry="70" fill="#C8E6C9"/>
  <!-- Corps principal château -->
  <rect x="120" y="140" width="160" height="100" rx="4" fill="#F5F1E8" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <!-- Créneaux corps principal -->
  <path d="M120 140 v-18 h18 v18 h16 v-18 h18 v18 h16 v-18 h18 v18 h16 v-18 h18 v18 h16 v-18 h18 v18 v-0" fill="#F5F1E8" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <!-- Tour gauche -->
  <rect x="70" y="110" width="60" height="130" rx="4" fill="#EDE6D6" stroke="#4A3728" stroke-width="6"/>
  <rect x="62" y="88" width="76" height="28" rx="4" fill="#EDE6D6" stroke="#4A3728" stroke-width="6"/>
  <path d="M62 88 v-14 h12 v14 h10 v-14 h12 v14 h10 v-14 h12 v14 h10 v-14 h10 v14" fill="#EDE6D6" stroke="#4A3728" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tour droite -->
  <rect x="270" y="110" width="60" height="130" rx="4" fill="#EDE6D6" stroke="#4A3728" stroke-width="6"/>
  <rect x="262" y="88" width="76" height="28" rx="4" fill="#EDE6D6" stroke="#4A3728" stroke-width="6"/>
  <path d="M262 88 v-14 h12 v14 h10 v-14 h12 v14 h10 v-14 h12 v14 h10 v-14 h10 v14" fill="#EDE6D6" stroke="#4A3728" stroke-width="5" stroke-linejoin="round"/>
  <!-- Toits tours -->
  <path d="M62 74 L100 30 L138 74 Z" fill="#8B9DC3" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <path d="M262 74 L300 30 L338 74 Z" fill="#8B9DC3" stroke="#4A3728" stroke-width="6" stroke-linejoin="round"/>
  <!-- Porte -->
  <path d="M175 240 v-30 c0-14 11-25 25-25 c14 0 25 11 25 25 v30" fill="#8D6E63" stroke="#4A3728" stroke-width="6"/>
  <circle cx="210" cy="215" r="3" fill="#4A3728"/>
  <!-- Fenêtres -->
  <rect x="145" y="165" width="18" height="28" rx="9" fill="#8B9DC3" stroke="#4A3728" stroke-width="5"/>
  <rect x="237" y="165" width="18" height="28" rx="9" fill="#8B9DC3" stroke="#4A3728" stroke-width="5"/>
  <rect x="85" y="155" width="14" height="22" rx="7" fill="#8B9DC3" stroke="#4A3728" stroke-width="4"/>
  <rect x="301" y="155" width="14" height="22" rx="7" fill="#8B9DC3" stroke="#4A3728" stroke-width="4"/>
  <!-- Drapeau -->
  <line x1="100" y1="30" x2="100" y2="12" stroke="#4A3728" stroke-width="3"/>
  <path d="M100 12 L125 18 L100 24 Z" fill="#EF5350" stroke="#4A3728" stroke-width="3" stroke-linejoin="round"/>
</svg>