services:

  nginx_api:
    container_name: nginx_api_${PROJECT_NAME}
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      PHP_HOST: php_${PROJECT_NAME}
    volumes:
      - ./symfony-app:/var/www/html
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - php
    networks:
      - dordogne

  php:
    container_name: php_${PROJECT_NAME}
    build:
      context: ./docker/php
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      PROJECT_NAME: ${PROJECT_NAME}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      APP_FRONT_URL: ${APP_FRONT_URL_PROD}
    volumes:
      - ./symfony-app:/var/www/html
      - ./logs/symfony:/var/www/html/var/log
      - ./caches/symfony:/var/www/html/var/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dordogne

  mysql:
    container_name: mysql_${PROJECT_NAME}
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${PROJECT_DBNAME}
      MYSQL_USER: ${PROJECT_DBNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./datas/mysql:/var/lib/mysql
    networks:
      - dordogne
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    container_name: phpmyadmin_${PROJECT_NAME}
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: mysql_${PROJECT_NAME}
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dordogne

  frontend:
    container_name: frontend_${PROJECT_NAME}
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - nginx_api
    networks:
      - dordogne

networks:
  dordogne:
    driver: bridge
